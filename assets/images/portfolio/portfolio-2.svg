<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
        <defs>
          <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#070b16" />
            <stop offset="100%" stop-color="#141933" />
          </linearGradient>
          <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFE082" />
            <stop offset="50%" stop-color="#FFB703" />
            <stop offset="100%" stop-color="#D48800" />
          </linearGradient>
          <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="15" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>
        <rect width="600" height="380" fill="url(#bg2)" />
        <circle cx="300" cy="170" r="150" fill="#FFB703" opacity="0.12" filter="url(#glowGold)" />

        <!-- Brand Mockup Station -->
        <!-- Main Brand Board -->
        <g transform="translate(60, 40)">
          <rect width="270" height="295" rx="16" fill="rgba(20, 26, 56, 0.7)" stroke="rgba(255, 183, 3, 0.3)" stroke-width="1.5" />
          
          <!-- Crest Logo -->
          <circle cx="135" cy="85" r="42" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
          <polygon points="135,55 145,75 168,75 150,90 157,112 135,98 113,112 120,90 102,75 125,75" fill="url(#goldGrad)" opacity="0.9" transform="scale(0.55) translate(110, 45)" />
          <text x="135" y="150" fill="url(#goldGrad)" font-family="Georgia, serif" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="2">L’ÉTOILE</text>
          <text x="135" y="168" fill="#CBD5E1" font-family="sans-serif" font-size="9" text-anchor="middle" letter-spacing="3">FINE DINING &amp; LOUNGE</text>

          <!-- Color Palette Strip -->
          <g transform="translate(35, 195)">
            <rect x="0" y="0" width="38" height="38" rx="8" fill="#0A0E1A" stroke="rgba(255,255,255,0.2)" />
            <rect x="48" y="0" width="38" height="38" rx="8" fill="#FFB703" />
            <rect x="96" y="0" width="38" height="38" rx="8" fill="#FF5CA8" />
            <rect x="144" y="0" width="38" height="38" rx="8" fill="#2534C8" />
            <text x="100" y="55" fill="#8E9BAE" font-family="sans-serif" font-size="9" text-anchor="middle">Official Color System</text>
          </g>

          <rect x="35" y="260" width="200" height="1" fill="rgba(255,255,255,0.1)" />
          <text x="135" y="280" fill="#FFB703" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Visual Identity Guide • 38 Pages</text>
        </g>

        <!-- Business Card & Packaging Mockups -->
        <g transform="translate(355, 55)">
          <!-- Luxury Business Card -->
          <rect width="185" height="110" rx="10" fill="#0c1024" stroke="rgba(255, 183, 3, 0.4)" stroke-width="1.5" />
          <circle cx="45" cy="55" r="16" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />
          <text x="45" y="60" fill="url(#goldGrad)" font-family="serif" font-size="14" font-weight="bold" text-anchor="middle">L</text>
          <text x="80" y="48" fill="#FFFFFF" font-family="Georgia, serif" font-size="12" font-weight="bold">L’Étoile Lounge</text>
          <text x="80" y="64" fill="#FFB703" font-family="sans-serif" font-size="8.5">Executive Chef &amp; Owner</text>
          <text x="80" y="80" fill="#8E9BAE" font-family="sans-serif" font-size="8">+20 155 805 4551</text>
        </g>

        <!-- Menu Mockup Card -->
        <g transform="translate(355, 185)">
          <rect width="185" height="145" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2" />
          <rect x="20" y="20" width="145" height="8" rx="4" fill="url(#goldGrad)" />
          <rect x="20" y="40" width="100" height="6" rx="3" fill="#8E9BAE" />
          <rect x="20" y="55" width="130" height="5" rx="2.5" fill="rgba(255,255,255,0.15)" />
          <rect x="20" y="68" width="115" height="5" rx="2.5" fill="rgba(255,255,255,0.15)" />
          
          <rect x="20" y="90" width="145" height="40" rx="8" fill="rgba(255, 183, 3, 0.15)" />
          <text x="92" y="115" fill="#FFB703" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Packaging &amp; Cutlery Kit</text>
        </g>
      </svg>