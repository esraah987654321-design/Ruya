<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
        <defs>
          <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0a0e27" />
            <stop offset="50%" stop-color="#141a45" />
            <stop offset="100%" stop-color="#231238" />
          </linearGradient>
          <linearGradient id="gradPink" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF5CA8" />
            <stop offset="100%" stop-color="#FF1493" />
          </linearGradient>
          <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2534C8" />
            <stop offset="100%" stop-color="#5B6BFF" />
          </linearGradient>
          <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="12" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>
        <rect width="600" height="380" fill="url(#bg1)" />
        <circle cx="500" cy="80" r="140" fill="#FF5CA8" opacity="0.15" filter="url(#glow1)" />
        <circle cx="100" cy="300" r="160" fill="#2534C8" opacity="0.25" filter="url(#glow1)" />

        <!-- Ad Card Mockup -->
        <g transform="translate(60, 45)">
          <rect width="280" height="290" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
          
          <!-- Ad Header -->
          <circle cx="35" cy="32" r="14" fill="url(#gradPink)" />
          <text x="35" y="36" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">R</text>
          <text x="58" y="28" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold">Ruya Fashion Store</text>
          <text x="58" y="42" fill="#8E9BAE" font-family="sans-serif" font-size="9.5">Sponsored • Meta &amp; TikTok</text>

          <!-- Creative Image Mockup -->
          <rect x="20" y="58" width="240" height="150" rx="10" fill="#18204a" />
          <!-- Fashion silhouette graphic -->
          <path d="M 140 85 Q 160 110 140 160 Q 125 180 140 195 L 140 95 Z" fill="url(#gradPink)" opacity="0.8" />
          <circle cx="140" cy="80" r="10" fill="#FFB703" />
          <rect x="35" y="150" width="120" height="36" rx="6" fill="rgba(0,0,0,0.6)" backdrop-filter="blur(5px)" />
          <text x="45" y="166" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold">Summer Collection</text>
          <text x="45" y="179" fill="#FFB703" font-family="sans-serif" font-size="9.5">Up to 40% OFF</text>

          <!-- CTA Button -->
          <rect x="20" y="222" width="240" height="42" rx="8" fill="url(#gradBlue)" />
          <text x="140" y="248" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Shop Now • تسوق الآن</text>
        </g>

        <!-- Metrics Dashboard Floating Card -->
        <g transform="translate(360, 55)">
          <rect width="180" height="100" rx="14" fill="rgba(16, 22, 48, 0.85)" stroke="rgba(255, 92, 168, 0.4)" stroke-width="1.5" />
          <text x="20" y="32" fill="#8E9BAE" font-family="sans-serif" font-size="11">Return on Ad Spend</text>
          <text x="20" y="65" fill="#FFB703" font-family="sans-serif" font-size="28" font-weight="bold">6.4X</text>
          <rect x="100" y="45" width="60" height="22" rx="11" fill="rgba(37, 211, 102, 0.2)" />
          <text x="130" y="60" fill="#25D366" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">+320%</text>
          <text x="20" y="85" fill="#25D366" font-family="sans-serif" font-size="10">✓ Scale Profitable ROAS</text>
        </g>

        <!-- Orders Metric Floating Card -->
        <g transform="translate(360, 175)">
          <rect width="180" height="100" rx="14" fill="rgba(16, 22, 48, 0.85)" stroke="rgba(37, 52, 200, 0.5)" stroke-width="1.5" />
          <text x="20" y="32" fill="#8E9BAE" font-family="sans-serif" font-size="11">Total Orders</text>
          <text x="20" y="65" fill="#FFFFFF" font-family="sans-serif" font-size="26" font-weight="bold">1,840+</text>
          <!-- Mini Bar Chart -->
          <rect x="105" y="65" width="10" height="15" rx="3" fill="#5B6BFF" />
          <rect x="120" y="55" width="10" height="25" rx="3" fill="#5B6BFF" />
          <rect x="135" y="42" width="10" height="38" rx="3" fill="#FF5CA8" />
          <rect x="150" y="32" width="10" height="48" rx="3" fill="#FFB703" />
          <text x="20" y="85" fill="#8E9BAE" font-family="sans-serif" font-size="10">Delivered Orders</text>
        </g>

        <!-- Floating Badge -->
        <g transform="translate(330, 290)">
          <rect width="210" height="36" rx="18" fill="rgba(255, 183, 3, 0.15)" stroke="#FFB703" stroke-width="1" />
          <circle cx="20" cy="18" r="6" fill="#FFB703" />
          <text x="35" y="22" fill="#FFB703" font-family="sans-serif" font-size="11" font-weight="bold">Meta &amp; TikTok Verified Partner</text>
        </g>
      </svg>